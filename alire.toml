name = "archive"
description = "Graphical archive manager"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/bracke/archive"
long-description = "archive is a graphical desktop archive manager, structured as a sibling of the existing files application."
tags = ["archive", "gui", "zip", "tar", "gzip"]

executables = ["archive"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
guikit = "*"

[[pins]]
guikit = { path = "../guikit" }

[[depends-on]]
i18n = "*"

[[depends-on]]
messages = "*"

[[pins]]
i18n = { path = "../i18n" }

[[pins]]
messages = { path = "../messages" }

[[depends-on]]
tarlib = "*"

[[pins]]
tarlib = { path = "../tarlib" }

[[depends-on]]
zlib = "*"

[[pins]]
zlib = { path = "../zlib" }

[[pins]]
cryptolib = { path = "../cryptolib" }

[[depends-on]]
cryptolib = "*"

[[depends-on]]
hostkit = "*"

[[pins]]
hostkit = { path = "../hostkit" }

[[depends-on]]
textrender = "*"

[[pins]]
textrender = { path = "../textrender" }

[[depends-on]]
df_vulkan = "~0.1.0"

[[depends-on]]
openglada_glfw = "~0.9.0"

[[depends-on]]
utilada = "^2.9.0"

# Bundle i18n's generated locale data into share/i18n after every build. The
# load-only i18n serves formatting from those files at runtime, so a deployed
# bin/archive must ship them (found at Exe/../share/i18n). bundle_i18n_data is a
# standalone Ada tool (tools/i18n_bundle) kept out of the app's own bin so it is
# never installed; build it, then run it. Both steps are plain executables --
# no shell. gprbuild is incremental, so the build step is a no-op once current.
[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "tools/i18n_bundle/bundle_i18n_data.gpr", "-p", "-q"]

[[actions]]
type = "post-build"
command = ["tools/i18n_bundle/bin/bundle_i18n_data"]

[build-profiles]
"*" = "development"
